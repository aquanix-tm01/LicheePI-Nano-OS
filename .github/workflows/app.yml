name: Build app

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Base image tag (latest or a commit sha)'
        default: 'latest'
  push:
    branches: [main]
    paths:
      - 'myapp/**'
      - 'br2-external/package/**'
      - 'docker/Dockerfile.app'
      - '.github/workflows/app.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-base" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cross-compile myapp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          target: appout
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}
            BASE_VERSION=${{ inputs.base_version || 'latest' }}
          outputs: type=local,dest=out

      - name: Check binary
        run: file out/myapp && ls -lh out/myapp

      - uses: actions/upload-artifact@v4
        with:
          name: myapp-armv5
          path: out/myapp
